name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: multilingua
          POSTGRES_PASSWORD: multilingua
          POSTGRES_DB: multilingua_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U multilingua -d multilingua_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql://multilingua:multilingua@localhost:5432/multilingua_test
      SESSION_SECRET: ci-placeholder-not-used-outside-ci
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: warning
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Integration tests
        run: uv run pytest -m integration

      - name: Audit Python dependencies
        run: uv run pip-audit

  web:
    name: Web - lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit web dependencies
        # Production tree only. The dev tree pulls `braces` through
        # `eslint-config-next -> @next/eslint-plugin-next -> fast-glob ->
        # micromatch`; GHSA-vfj7-8cjw-p6xm has no patched release and is not
        # reachable from user input.
        run: pnpm audit --prod --audit-level=high
