[project]
name = "multilingua-api"
version = "0.1.0"
description = "API for the multilingual event platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
    "psycopg[binary]==3.3.6",
    "httpx2==2.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "ASYNC",
    "S",   # bandit
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "DTZ", # flake8-datetimez
    "RUF100",
]
ignore = [
    "S101", # assert is used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "integration: tests that require a live PostgreSQL instance",
]
